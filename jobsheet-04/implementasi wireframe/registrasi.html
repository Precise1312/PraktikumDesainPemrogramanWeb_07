
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Anggota Baru</title>
    <link rel="stylesheet" href="registrasi.css">
</head>
<body>

    <main class="container">
        <header>
            SISTEM PERPUSTAKAAN
        </header>

        <section>
            <h2>REGISTRASI ANGGOTA BARU</h2>

            <form>
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama"
                           placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="form-group">
                    <label for="identitas">Nomor Identitas / NIM</label>
                    <input type="text" id="identitas" name="identitas"
                           placeholder="Masukkan nomor identitas" required>
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat</label>
                    <input type="text" id="alamat" name="alamat"
                           placeholder="Masukkan alamat" required>
                </div>

                <div class="form-group">
                    <label for="no_hp">Nomor HP</label>
                    <input type="tel" id="no_hp" name="no_hp"
                           placeholder="Masukkan nomor HP" required>
                </div>

                <button type="submit">DAFTAR ANGGOTA</button>
            </form>

            <p class="tautan">
                <a href="#">Kembali ke Login</a>
            </p>
        </section>
    </main>

</body>
</html>
